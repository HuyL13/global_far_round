[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-far-round"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "transformers>=4.46", "accelerate>=0.26", "datasets>=2.19", "numpy>=1.24", "scipy>=1.10", "PyYAML>=6", "safetensors>=0.4"]

